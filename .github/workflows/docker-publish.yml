name: Build & Publish Personal Server Image

on:
  push:
    branches: [main]
    paths:
      - 'services/personal-server/**'
      - '.github/workflows/docker-publish.yml'
  schedule:
    # 每天 UTC 18:00（北京时间凌晨 2 点）同步上游并重建镜像
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  UPSTREAM_REPO: https://github.com/mason173/aira-browser.git
  UPSTREAM_BRANCH: main

jobs:
  sync-upstream:
    name: Sync personal-server from upstream
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream services/personal-server
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            "$UPSTREAM_REPO" upstream
          git -C upstream sparse-checkout set services/personal-server

      - name: Mirror into services/personal-server
        run: |
          rsync -a --delete \
            --exclude '.git' \
            upstream/services/personal-server/ services/personal-server/

      - name: Commit & push if changed
        id: commit
        run: |
          if git diff --quiet -- services/personal-server; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/personal-server
            git commit -m "chore: sync personal-server from upstream ($UPSTREAM_BRANCH)"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changes committed."
          fi

  build-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    needs: sync-upstream
    # 定时任务时仅在上游有变化才重新构建；手动/推送事件总是构建
    if: needs.sync-upstream.outputs.updated == 'true' || github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: services/personal-server
          file: services/personal-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
